name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Sign
        run: |
          echo "${{ secrets.PRIVATE_KEY }}" > /tmp/private.pem
          openssl pkeyutl -sign -inkey /tmp/private.pem -out dist/plugin_package.zip.sig -rawin -in dist/plugin_package.zip
          rm /tmp/private.pem

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            dist/plugin_package.zip
            dist/plugin_package.zip.sig
